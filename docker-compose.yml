services:
  db:
    image: pgvector/pgvector:pg17
    container_name: fairdecide-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fairdecide}
      POSTGRES_USER: ${POSTGRES_USER:-fairdecide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fairdecide_dev}
    ports:
      - "5432:5432"
    volumes:
      - fairdecide_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mail:
    # Local mail catcher: the app "sends" real SMTP email here; nothing ever leaves the machine.
    image: axllent/mailpit:v1.27
    container_name: fairdecide-mail
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # inbox web UI -> http://localhost:8025

volumes:
  fairdecide_pgdata:
